
mt:
  states: [q0, q1, q2, q3, q4, q5, qf]
  input_alphabet: [a, b, c]
  tape_alphabet: [a, b, c, X, Y, Z, B]
  initial_state: q0
  accept_states: [qf]
  transitions:
    # q0: marcar una a o iniciar la verificación
    - state: q0
      read: [a, B]
      write: [B, X]
      move: R
      next: q1
    - state: q0
      read: [Y, B]
      write: [B, Y]
      move: R
      next: q4

    # q1: buscar la primera b
    - state: q1
      read: [a, B]
      write: [B, a]
      move: R
      next: q1
    - state: q1
      read: [Y, B]
      write: [B, Y]
      move: R
      next: q1
    - state: q1
      read: [b, B]
      write: [B, Y]
      move: R
      next: q2

    # q2: buscar la primera c
    - state: q2
      read: [b, B]
      write: [B, b]
      move: R
      next: q2
    - state: q2
      read: [Z, B]
      write: [B, Z]
      move: R
      next: q2
    - state: q2
      read: [c, B]
      write: [B, Z]
      move: L
      next: q3

    # q3: regresar hasta la X
    - state: q3
      read: [a, B]
      write: [B, a]
      move: L
      next: q3
    - state: q3
      read: [b, B]
      write: [B, b]
      move: L
      next: q3
    - state: q3
      read: [Y, B]
      write: [B, Y]
      move: L
      next: q3
    - state: q3
      read: [Z, B]
      write: [B, Z]
      move: L
      next: q3
    - state: q3
      read: [X, B]
      write: [B, X]
      move: R
      next: q0

    # q4: solo deben quedar Y antes de las Z
    - state: q4
      read: [Y, B]
      write: [B, Y]
      move: R
      next: q4
    - state: q4
      read: [Z, B]
      write: [B, Z]
      move: R
      next: q5

    # q5: solo deben quedar Z hasta el final
    - state: q5
      read: [Z, B]
      write: [B, Z]
      move: R
      next: q5
    - state: q5
      read: [B, B]
      write: [B, B]
      move: L
      next: qf
  inputs:
    - "aabbcc"      
    - "aaabbbccc"  
    - "aabbbcc"     
    - "abcabc"      
